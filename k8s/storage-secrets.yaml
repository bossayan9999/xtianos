apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xtiandos-vault-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xtiandos-workspace-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: xtiandos-secrets
  namespace: default
type: Opaque
stringData:
  database-url: "postgresql://xtiandos:password@xtiandos-postgres:5432/xtiandos"
  master-secret: "change-me-in-production-with-strong-secret"
  auth-token: "change-me-in-production"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xtiandos
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xtiandos-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
