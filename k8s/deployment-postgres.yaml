apiVersion: apps/v1
kind: Deployment
metadata:
  name: xtiandos-postgres
  namespace: default
  labels:
    app: xtiandos
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xtiandos
      component: postgres
  template:
    metadata:
      labels:
        app: xtiandos
        component: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: xtiandos
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xtiandos-secrets
              key: db-password
        - name: POSTGRES_DB
          value: xtiandos
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "xtiandos"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "xtiandos"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: xtiandos-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xtiandos-postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: xtiandos-postgres
  namespace: default
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: xtiandos
    component: postgres
