apiVersion: apps/v1
kind: Deployment
metadata:
  name: xtiandos-redis
  namespace: default
  labels:
    app: xtiandos
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xtiandos
      component: redis
  template:
    metadata:
      labels:
        app: xtiandos
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
          - redis-server
          - "--appendonly"
          - "yes"
          - "--maxmemory"
          - "2gb"
          - "--maxmemory-policy"
          - "allkeys-lru"
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: xtiandos-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xtiandos-redis-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: xtiandos-redis
  namespace: default
spec:
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: xtiandos
    component: redis
